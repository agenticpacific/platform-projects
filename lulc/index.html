<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add a COG raster source</title>
    <meta property="og:description" content="Add an external Cloud Optimized Geotiff (COG) as source." />
    <meta property="og:category" content="Raster & Imagery" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }

        .legend {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 1;
            background: rgba(17, 24, 39, 0.88);
            color: #f9fafb;
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            font: 12px/1.35 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 240px;
        }

        .legend h2 {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            white-space: nowrap;
        }

        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex: 0 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="legend" aria-label="Land cover legend">
        <h2>Land cover</h2>
        <div class="legend-item"><span class="legend-swatch" style="background:#419BDF"></span><span>0 - Water</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#397D49"></span><span>1 - Trees</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#88B053"></span><span>2 - Grass</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#7A87C6"></span><span>3 - Flooded Vegetation</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#E49635"></span><span>4 - Crops</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#DFC35A"></span><span>5 - Low-laying Vegetation</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#C4281B"></span><span>6 - Built-up Area</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#A59B8F"></span><span>7 - Bare Ground</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#B39FE1"></span><span>8 - Unknown</span></div>
    </div>
    <script src="https://unpkg.com/@geomatico/maplibre-cog-protocol@0.5.0/dist/index.js"></script>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';

        maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);

        const cogUrl = 'https://agenticpacific.com.fj/platform-projects/data/fj_lulc/annual/fj_lulc_annual_2025_3857.tif';
        const cogPalette = [
            '#419BDF',
            '#397D49',
            '#88B053',
            '#7A87C6',
            '#E49635',
            '#DFC35A',
            '#C4281B',
            '#A59B8F',
            '#B39FE1'
        ];

        MaplibreCOGProtocol.setColorFunction(cogUrl, (pixel, color, metadata) => {
            const value = pixel[0];

            if (value === metadata.noData || value < 0 || value > 8) {
                color.set([0, 0, 0, 0]);
                return;
            }

            const hex = cogPalette[value];
            const red = Number.parseInt(hex.slice(1, 3), 16);
            const green = Number.parseInt(hex.slice(3, 5), 16);
            const blue = Number.parseInt(hex.slice(5, 7), 16);

            color.set([red, green, blue, 255]);
        });

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {},
                layers: []
            },
            center: [178.53854456725483, -17.412011076376925],
            zoom: 8
        });

        map.on('load', () => {
            map.addSource('basemapSource', {
                type: 'raster',
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                tileSize: 256,
                attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'
            });

            map.addLayer({
                id: 'basemapLayer',
                source: 'basemapSource',
                type: 'raster'
            });

            map.addSource('cogSource', {
                type: 'raster',
                url: `cog://${cogUrl}`,
                tileSize: 256
            });

            map.addLayer({
                id: 'cogLayer',
                source: 'cogSource',
                type: 'raster'
            });
        });
    </script>
</body>

</html>
